name: Build & release

# Push a tag like v1.0.1 to build the Windows installer + portable exe and attach
# them to a GitHub Release. If the Microsoft Store identity variables are set
# (repo Settings → Secrets and variables → Actions → Variables), a Store .appx
# package is built too.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable
        run: npx electron-builder --win nsis portable --publish never
      - name: Build Microsoft Store package
        if: ${{ vars.APPX_IDENTITY_NAME != '' && vars.APPX_PUBLISHER != '' }}
        run: >
          npx electron-builder --win appx --publish never
          "--config.appx.identityName=${{ vars.APPX_IDENTITY_NAME }}"
          "--config.appx.publisher=${{ vars.APPX_PUBLISHER }}"
          "--config.appx.publisherDisplayName=${{ vars.APPX_PUBLISHER_DISPLAY_NAME || 'Collin' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vr-player-windows
          path: |
            dist/*.exe
            dist/*.appx
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VR-Player-Setup-*.exe
            dist/VR-Player-*-portable.exe
